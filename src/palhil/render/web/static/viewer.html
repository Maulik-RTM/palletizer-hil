<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>palletizer-hil cell (web)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0c0e11; color:#e8eaed;
              font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow:hidden; }
  #cv { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:12px; left:12px; padding:10px 12px; background:rgba(14,16,20,.72);
         border:1px solid #3a3f47; border-radius:6px; white-space:pre; pointer-events:none; }
  #hud b { color:#8fd6ff; } .ok{color:#57d98a;} .bad{color:#ff6b6b;}
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          background:#0c0e11; color:#9aa0a6; font-size:15px; z-index:10; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">connecting…</div>
<div id="boot">loading palletizer-hil cell…</div>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/GLTFLoader.js"></script>
<script>
"use strict";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0c0e11);
const cam=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 100);
const rnd=new THREE.WebGLRenderer({canvas:document.getElementById('cv'), antialias:true});
rnd.setPixelRatio(Math.min(devicePixelRatio,2)); rnd.setSize(innerWidth,innerHeight);
scene.add(new THREE.HemisphereLight(0xe6ecff,0x262b33,1.05));
const key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(2.5,4,2.5); scene.add(key);
const fill=new THREE.DirectionalLight(0xa8bcff,0.45); fill.position.set(-2.5,2,-2.5); scene.add(fill);

const mat=(c,m=0.2,r=0.7)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const M={ steel:mat(0x8a9099,0.7,0.45), joint:mat(0x2b2f36,0.5,0.6), floor:mat(0x2a2d33,0,1),
          box:mat(0xc79a5b,0,0.85), boxAlt:mat(0xb5854a,0,0.85), pallet:mat(0x6b4d31,0,0.92),
          gripper:mat(0x3a3f47,0.6,0.4), lane:mat(0x30343c,0.2,0.8), tcp:mat(0x35b05a,0,0.6) };

// ---- WORLD group: plant is z-up (metres); rotate so plant (x,y,z) -> three (x,z,-y)
const W=new THREE.Group(); W.rotation.x=-Math.PI/2; scene.add(W);

// ---- orbit camera (no OrbitControls dependency) ----------------------------
let az=0.7, el=0.42, rad=4.2, tgt=new THREE.Vector3(0,0.2,0), drag=false, px=0, py=0;
function placeCam(){ cam.position.set(tgt.x+rad*Math.cos(el)*Math.sin(az), tgt.y+rad*Math.sin(el),
                                      tgt.z+rad*Math.cos(el)*Math.cos(az)); cam.lookAt(tgt); }
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); rnd.setSize(innerWidth,innerHeight);});
const cv=document.getElementById('cv');
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{ if(!drag)return; az-=(e.clientX-px)*0.006; el=clamp(el+(e.clientY-py)*0.006,-0.2,1.4); px=e.clientX;py=e.clientY; });
cv.addEventListener('wheel',e=>{rad=clamp(rad*(1+Math.sign(e.deltaY)*0.08),1.5,12); e.preventDefault();},{passive:false});

// ---- UR20 kinematics (JS port of plant/ur20_pose.py) -----------------------
function dhT(theta,d,a,al){ const ct=Math.cos(theta),st=Math.sin(theta),ca=Math.cos(al),sa=Math.sin(al);
  const m=new THREE.Matrix4();
  m.set(ct,-st*ca, st*sa, a*ct,  st, ct*ca,-ct*sa, a*st,  0, sa, ca, d,  0,0,0,1); return m; }
function linkFrames(joints,dh){ let T=new THREE.Matrix4(); const F=[T.clone()];
  for(let i=0;i<6;i++){ const r=dh[i]; T=T.clone().multiply(dhT(joints[i],r[0],r[1],r[2])); F.push(T.clone()); } return F; }
let DH=null, HOME=null, HOME_INV=null;

// ---- cell construction from /config.json -----------------------------------
let CFG=null, MODE='stylized'; let arm=null; const placedPool=[]; const lanePool=[]; let carryMesh=null;
function box(sx,sy,sz,material){ return new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material); }
function addBox(sx,sy,sz,material){ const m=box(sx,sy,sz,material); W.add(m); return m; }

function rod(material,rA=0.05,rB=null){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rA,rB==null?rA:rB,1,14),material);
  W.add(m); return m; }
function poseRod(r,A,B){ const mid=A.clone().add(B).multiplyScalar(0.5), dir=B.clone().sub(A), len=dir.length();
  r.position.copy(mid); r.scale.set(1,Math.max(len,1e-4),1);
  r.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize()); }

function buildCell(cfg){
  CFG=cfg; MODE=cfg.robot_model||'stylized'; DH=cfg.dh; HOME=linkFrames([0,0,0,0,0,0],DH);
  HOME_INV=HOME.map(m=>m.clone().invert());
  // floor at the pedestal foot (plant z = -mount_height)
  const fl=addBox(4.2,4.2,0.02,M.floor); fl.position.set(0,0,-cfg.mount_height-0.01);
  // pallets (rotated decks)
  for(const p of cfg.pallets){ const [cx,cy,cz]=p.center;
    const deck=addBox(p.lw[0],p.lw[1],p.h,M.pallet); deck.position.set(cx,cy,cz-p.h/2); deck.rotation.z=p.yaw; }
  // lane stubs (visual)
  for(const L of cfg.lanes){ const s=addBox(CFG.box[0]*1.4,CFG.box[1]*1.4,0.04,M.lane); s.position.set(L[0],L[1],L[2]-0.14); }
  // robot
  if(MODE==='real') buildRealArm(cfg); else buildStylizedArm();
  document.getElementById('boot')?.remove();
}

// stylized: base + 6 link rods between DH frame origins + gripper + TCP marker
function buildStylizedArm(){
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.22,CFG.mount_height,28),M.steel);
  base.rotation.x=Math.PI/2; base.position.set(0,0,-CFG.mount_height/2); W.add(base);
  arm={rods:[], joints:[], gripper:null, tcp:null};
  for(let i=0;i<6;i++){ arm.rods.push(rod(i<3?M.steel:M.steel, 0.05-i*0.005));
    const j=new THREE.Mesh(new THREE.SphereGeometry(0.07,16,12),M.joint); W.add(j); arm.joints.push(j); }
  arm.gripper=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.05,0.10,16),M.gripper); W.add(arm.gripper);
  arm.tcp=addBox(0.04,0.04,0.04,M.tcp);
}
function poseStylized(joints){
  const F=linkFrames(joints,DH), O=F.map(m=>new THREE.Vector3().setFromMatrixPosition(m));
  for(let i=0;i<6;i++){ poseRod(arm.rods[i],O[i],O[i+1]); arm.joints[i].position.copy(O[i]); }
  const flange=O[6]; arm.gripper.position.copy(flange);
  // gripper points along the flange z-axis
  const zc=new THREE.Vector3(); F[6].extractBasis(new THREE.Vector3(),new THREE.Vector3(),zc);
  arm.gripper.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),zc.clone().normalize());
  arm.tcp.position.copy(flange);
}

// real: per-link glTF placed by M_i = frame_i(q) @ frame_i(0)^-1  (ur20_pose)
function buildRealArm(cfg){
  const loader=new THREE.GLTFLoader(); arm={parts:{}, names:cfg.link_names, ready:0};
  cfg.link_names.forEach((nm,i)=>{ loader.load(`/static/robot/${nm}.glb`, g=>{
      const o=g.scene; o.matrixAutoUpdate=false; o.traverse(m=>{if(m.isMesh)m.material=M.steel;});
      arm.parts[i]=o; W.add(o); arm.ready++;
    }, undefined, ()=>console.warn('missing link glTF:', nm, '(run scripts/build_ur20_glb.py)')); });
}
function poseReal(joints){
  if(!arm||arm.ready===0) return; const F=linkFrames(joints,DH);
  for(let i=0;i<7;i++){ const o=arm.parts[i]; if(!o) continue;
    o.matrix.copy(F[i].clone().multiply(HOME_INV[i])); }   // M_i applied to home-pose mesh
}

// ---- snapshot handling -----------------------------------------------------
function applySnapshot(s){
  (MODE==='real'?poseReal:poseStylized)(s.joints);
  // placed boxes (pool, grows only)
  for(let k=0;k<s.placed.length;k++){ let m=placedPool[k];
    if(!m){ m=addBox(CFG.box[0],CFG.box[1],CFG.box[2], k%2?M.boxAlt:M.box); placedPool[k]=m; }
    const [x,y,z,yaw]=s.placed[k]; m.visible=true; m.position.set(x,y,z+CFG.box[2]/2); m.rotation.z=yaw; }
  for(let k=s.placed.length;k<placedPool.length;k++) placedPool[k].visible=false;
  // lane boxes
  for(let k=0;k<lanePool.length;k++) lanePool[k].visible=false;
  s.lanes.forEach((L,k)=>{ let m=lanePool[k]; if(!m){ m=addBox(CFG.box[0],CFG.box[1],CFG.box[2],M.box); lanePool[k]=m; }
    m.visible=true; m.position.set(L[1],L[2],L[3]-CFG.box[2]/2); m.rotation.z=0; });
  // carried box
  if(s.carry){ if(!carryMesh) carryMesh=addBox(CFG.box[0],CFG.box[1],CFG.box[2],M.box);
    carryMesh.visible=true; carryMesh.position.set(s.carry[0],s.carry[1],s.carry[2]); }
  else if(carryMesh) carryMesh.visible=false;
  hud(s);
}

function hud(s){ const L=s.ledger;
  document.getElementById('hud').innerHTML=
    `<b>palletizer-hil cell</b>  (${s.source||'mock'})   t=${s.t.toFixed(1)}s\n`+
    `pallets  ${s.pallet_count.map((c,i)=>`${c}${s.pallet_full[i]?'*':''}`).join('  ')}   (of ${3*90})\n`+
    `held ${L.on_gripper?'BOX':' — '}   vacuum ${s.vacuum?'ON':'off'}\n`+
    `ledger infed ${L.infed}  lane ${L.on_lane}  grip ${L.on_gripper}  pallet <b>${L.on_pallet}</b>  rej ${L.rejected}\n`+
    `conserved <span class="${L.conserved?'ok':'bad'}">${L.conserved?'yes':'NO'}</span>   reach viol ${L.reach}`;
}

// ---- boot ------------------------------------------------------------------
function connect(){ const ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=e=>applySnapshot(JSON.parse(e.data)); ws.onclose=()=>setTimeout(connect,1000); }
fetch('/config.json').then(r=>r.json()).then(cfg=>{ buildCell(cfg);
  if(MODE==='real'){ rad=5.0; } placeCam(); connect(); });
(function loop(){ requestAnimationFrame(loop); if(!drag) az+=0.0004; placeCam(); rnd.render(scene,cam); })();
</script>
</body>
</html>
